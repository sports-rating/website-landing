name: Deploy nuxt.js
on:
  push:
    branches:
      - dev

env:
  DOCKER_IMAGE: ${{ vars.DEV_CONTAINER_REGISTRY }}/${{ vars.DEV_CONTAINER_REGISTRY_NAMESPACE }}/${{ vars.DOCKER_IMAGE_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Get Commit Hash
        id: commit
        uses: prompt/actions-commit-hash@v3

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into registry ${{ vars.CONTAINER_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          provenance: false
          file: Dockerfile
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.commit.outputs.short }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      - name: SSH run docker container
        uses: appleboy/ssh-action@master
        with:
          port: 22
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.PAT_ACCESS_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.DOCKER_IMAGE }}:${{ steps.commit.outputs.short }}
            docker rm -f ${{ vars.CONTAINER_NAME }} || true
            docker run -d --restart always -p 3000:3000 --name ${{ vars.CONTAINER_NAME }} ${{ env.DOCKER_IMAGE }}:${{ steps.commit.outputs.short }}
