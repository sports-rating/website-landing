name: Cleanup old Docker images

on:
  schedule:
    - cron: "0 22 * * *"  # runs daily at 22:00 UTC
  workflow_dispatch:      # allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Delete old versions of dev-sports-rating-landing
        uses: actions/delete-package-versions@v4
        with:
          package-name: dev-sports-rating-landing
          package-type: container
          min-versions-to-keep: 10

      - name: Delete old versions of prod-sports-rating-landing
        uses: actions/delete-package-versions@v4
        with:
          package-name: prod-sports-rating-landing
          package-type: container
          min-versions-to-keep: 10
