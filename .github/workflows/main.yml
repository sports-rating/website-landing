name: Deploy Nuxt.js via Docker

on:
  push:
    branches:
      - main
env:
  DOCKER_IMAGE: ${{ vars.CONTAINER_REGISTRY_NAMESPACE }}/${{ vars.DOCKER_IMAGE_NAME }}

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Get Commit Hash
        id: commit
        uses: prompt/actions-commit-hash@v3

      - name: Build image
        run: |
          yes | docker build -t ${{ env.DOCKER_IMAGE }}:${{ steps.commit.outputs.short }} .

      - name: Deploy
        run: |
          docker rm -f ${{ vars.CONTAINER_NAME }} || true
          docker run -d -p 3000:3000 --name ${{ vars.CONTAINER_NAME }} ${{ env.DOCKER_IMAGE }}:${{ steps.commit.outputs.short }}
